name: Build Forma iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build unsigned app for iPhone
        run: |
          set -euo pipefail
          xcodebuild -project Forma.xcodeproj -scheme Forma -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Forma.app Payload/
          /usr/bin/zip -r Forma-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Forma-unsigned-ipa
          path: Forma-unsigned.ipa
          retention-days: 7
