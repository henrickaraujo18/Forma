name: Forma Web checks
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/forma-web.yml'
  pull_request:
    paths:
      - 'web/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: npm run check
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: Install browser testing
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install chromium --with-deps
        working-directory: web
      - name: Browser end-to-end tests
        run: npx playwright test
        working-directory: web
      - name: Save failed screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forma-web-e2e-artifacts
          path: |
            web/test-results/
