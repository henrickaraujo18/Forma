<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#101917"/><meta name="color-scheme" content="dark"/>
<meta name="description" content="Forma Fitness: treinos, evolução, cargas e saúde corporal em um único lugar."/>
<title>Forma Fitness · Painel</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="styles.css"/>
</head><body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">F</span><span class="brand-word">forma<span class="brand-sub">FITNESS</span></span></div>
    <div class="side-caption">PAINEL PESSOAL</div>
    <nav id="side-nav" class="side-nav" aria-label="Navegação principal"></nav>
    <div class="side-bottom">
      <div class="side-note"><div class="tiny-dot"></div> Seus dados salvos neste aparelho</div>
      <button class="side-install ghost" id="install-button" hidden>↧ Instalar Forma</button>
      <div class="side-version">FORMA FITNESS · 1.0</div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="top-left"><div class="crumb">FORMA <span>/</span> <span id="page-name">Visão geral</span></div><div class="top-date" id="today"></div></div>
      <div class="top-actions"><div class="profile-switch">
        <span class="avatar" id="active-avatar">H</span>
        <select id="profile-select" aria-label="Selecionar atleta"></select><span class="select-chevron">⌄</span>
      </div></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Navegação móvel"></nav>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="modal-backdrop" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="timer-banner" id="timer-banner" hidden><span>⏱ Descanso</span><strong id="timer-label">00:00</strong><button id="timer-dismiss" type="button">Encerrar</button></div>
<script type="module" src="app.js"></script>
</body></html>
